services:
  - type: web
    name: depgraph
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: COGNODB_DATABASE
        value: neo4j
